- workload_swap: true
  bindings:
    extra-collector:
      keep_resident: false
    extra-media:
      keep_resident: false
    extra-ssh:
      keep_resident: false
    flash-next:
      runtime_options:
        MAX_MODEL_LEN: '524288'
        MODEL_VARIANT: huihui_lil
        MTP_TOKENS: '3'
      memory_gib: 94
      model: edp1096/Huihui-Qwen3.8-Flash-Next-abliterated-NVFP4-QAD
      startup_memory_gib: 108
    flux2:
      start_after_llm: true
      keep_resident: true
      runtime_options:
        IMAGE_RESIDENCY: dit
      memory_gib: 14
      startup_memory_gib: 7
      workspace_memory_gib: 6
    nemotron-asr:
      start_after_llm: true
      keep_resident: true
    qwen3-tts:
      start_after_llm: true
      keep_resident: true
  id: flash-next
  name: Qwen 3.8 Flash-Next QAD
  description: 1× DGX Spark · QAD · FP8 KV 512K · MTP 3 · Qwen Image 2.1 DiT·ASR·TTS
    상주 · Extra 요청 시 실행
  model_type: qwen3.8
  model_id: edp1096/Huihui-Qwen3.8-Flash-Next-abliterated-NVFP4-QAD
  context_tokens: 524288
  components:
  - flash-next
  - extra-media
  - extra-ssh
  - extra-collector
  - flux2
  - nemotron-asr
  - qwen3-tts
  start_support: false
