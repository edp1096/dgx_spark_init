<!doctype html><html lang="ko"><meta charset="utf-8"><title>Talk 연결</title><link rel="stylesheet" href="connect.css"><body><h2><img src="spark.png" alt="" width="28" height="28" style="vertical-align:middle;margin-right:8px;border-radius:6px">SparkTalk 브라우저</h2><label>Talk 주소<input id="url" placeholder="http://192.168.100.61:8585"></label><label>연결 키<input id="token" type="password" autocomplete="off"></label><button id="connect">연결</button><button id="disconnect">연결 해제</button><button id="releaseTabs">작업 중지·탭 연결 해제</button><hr><div class="site-summary"><span id="siteCount">사이트 권한 확인 중…</span><button id="manageSites">사이트 관리</button></div><p id="status" role="status"></p><small>입력은 자동 저장되어 팝업을 닫아도 유지됩니다. Talk의 설정 → 기능 → 브라우저에서 연결 키를 발급하세요. 사이트 로그인 상태는 이 브라우저에 유지됩니다.</small><script src="connect.js"></script></body></html>
