services:
  runtime:
    image: dgx-sglang-gemma26:2ef0fe4-toolindex1
    pull_policy: never
    container_name: sglang-gemma26
    init: true
    restart: unless-stopped
    ipc: host
    shm_size: 16gb
    mem_limit: 100g
    memswap_limit: 100g
    cpuset: "5-9,15-19"
    gpus: all
    ports:
      - "${SPARKTALK_BIND_ADDR:-127.0.0.1}:${SPARKTALK_PORT:-8000}:30000"
    environment:
      MODEL_PATH: /hf/edp1096/Huihui-Gemma-4-26B-A4B-it-NVFP4
      SERVED_MODEL_NAME: edp1096/Huihui-Gemma-4-26B-A4B-it-NVFP4
      DRAFT_MODEL_PATH: /hf/google/gemma-4-26B-A4B-it-assistant
      MTP_TOKENS: "${MTP_TOKENS:-3}"
      DRAFT_VOCAB: "off"
      CONTEXT_LENGTH: "${CONTEXT_LENGTH:-1048576}"
      SGLANG_MAX_THINK_TOKENS: "1048576"
      SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN: "1"
      HF_HOME: /hf
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONUNBUFFERED: "1"
      TORCHINDUCTOR_COMPILE_THREADS: "2"
    volumes:
      - ${SPARKTALK_HF_CACHE:-${HOME}/.cache/huggingface}:/hf
      - ${SPARKTALK_DATA_DIR:-${HOME}/.local/share/sparktalk}/cache/sglang-gemma26:/root/.cache/sglang
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:30000/health',timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 15m
