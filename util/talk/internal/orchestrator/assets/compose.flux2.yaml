services:
  runtime:
    image: dgx-flux2-klein-nvfp4:4b
    container_name: flux2-klein-nvfp4-api
    restart: unless-stopped
    init: true
    network_mode: host
    ipc: host
    gpus: all
    environment:
      API_PORT: "${SPARKTALK_PORT:-8691}"
      COMFY_PORT: "8188"
      COMFY_KITCHEN_BACKEND: cuda
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      - media-hf-cache:/root/.cache/huggingface
volumes:
  media-hf-cache:
    name: media-hf-cache
