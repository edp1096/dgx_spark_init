services:
  runtime:
    image: sparktalk-qwen3-tts:0.6b-q8-lifecycle1
    build:
      context: ${SPARKTALK_BUILD_DIR:?Embedded build assets required}
      target: runtime
    pull_policy: never
    container_name: sparktalk-qwen3-tts
    restart: "no"
    init: true
    stop_grace_period: 30s
    mem_limit: "12g"
    memswap_limit: "12g"
    cpus: 4
    gpus: all
    ports: ["${SPARKTALK_BIND_ADDR:-127.0.0.1}:${SPARKTALK_PORT:-8692}:8692"]
    volumes:
      - ${SPARKTALK_QWEN_TTS_MODEL_DIR:-${HOME}/.cache/qwen3-tts}:/models:ro
