services:
  runtime:
    image: dgx-sglang-qwen38-qad:sm121-v3
    build:
      context: ${SPARKTALK_BUILD_DIR:?Embedded build assets required}
      dockerfile: Dockerfile
      target: qad-tp1
    pull_policy: never
    container_name: sglang-qwen38-fn
    restart: unless-stopped
    init: true
    ipc: host
    shm_size: "16gb"
    mem_limit: "112g"
    memswap_limit: "112g"
    cpuset: "5-9,15-19"
    ports: ["${SPARKTALK_BIND_ADDR:-127.0.0.1}:${SPARKTALK_PORT:-8000}:30000"]
    security_opt: ["seccomp=unconfined"]
    ulimits:
      memlock: {soft: -1, hard: -1}
    environment:
      SGLANG_QAD_B12X_GDN: "1"
      SGLANG_QAD_PLE_IO_URING: "1"
      B12X_POLICY_MODE: auto
      HF_HOME: /hf
      HF_HUB_OFFLINE: "1"
      PYTHONUNBUFFERED: "1"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      B12X_COMPILE_CACHE_DIR: /root/.cache/sglang/b12x-compile
      TRITON_CACHE_DIR: /root/.cache/sglang/triton
      TORCHINDUCTOR_CACHE_DIR: /root/.cache/sglang/inductor
      MAX_JOBS: "1"
      TORCHINDUCTOR_COMPILE_THREADS: "4"
      SGLANG_QWEN4_PLE_FILE_RSS_BUDGET_GB: "0.5"
      SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN: "1"
      SPARKTALK_FLASH_NEXT_DRAFT_VOCAB: "ko64k"
    volumes:
      - ${SPARKTALK_HF_CACHE:-${HOME}/.cache/huggingface}:/hf
      - ${SPARKTALK_DATA_DIR:-${HOME}/.local/share/sparktalk}/cache/sglang-flash-next-qad:/root/.cache/sglang
      - ${SPARKTALK_DATA_DIR:-${HOME}/.local/share/sparktalk}/cache/sglang-flash-next-qad/ple:/ple
    gpus: all
    entrypoint: ["python3", "/opt/sparktalk-flash-next/launch.py"]
    command:
      - "--model-path"
      - "/hf/hub/models--local-inference-lab--Qwen3.8-Flash-Next-NVFP4/snapshots/7c4f1bc1a2d6847e0cbc01ac6b823f00251de8dd"
      - "--served-model-name"
      - "local-inference-lab/Qwen3.8-Flash-Next-NVFP4"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "30000"
      - "--load-format"
      - "auto"
      - "--weight-loader-drop-cache-after-load"
      - "--tp-size"
      - "1"
      - "--context-length"
      - "1048576"
      - "--mem-fraction-static"
      - "0.85"
      - "--chunked-prefill-size"
      - "4096"
      - "--max-total-tokens"
      - "1048576"
      - "--max-running-requests"
      - "1"
      - "--page-size"
      - "64"
      - "--cuda-graph-max-bs-decode"
      - "1"
      - "--prefill-attention-backend"
      - "triton"
      - "--decode-attention-backend"
      - "trtllm_mha"
      - "--kv-cache-dtype"
      - "fp8_e4m3"
      - "--quantization"
      - "modelopt_mixed"
      - "--moe-runner-backend"
      - "flashinfer_cutlass"
      - "--disable-shared-experts-fusion"
      - "--fp4-gemm-backend"
      - "flashinfer_cutlass"
      - "--ple-offload-embedding"
      - "--ple-offload-backend"
      - "file"
      - "--ple-offload-dir"
      - "/ple"
      - "--mamba-radix-cache-strategy"
      - "extra_buffer"
      - "--reasoning-parser"
      - "qwen3"
      - "--tool-call-parser"
      - "qwen3_coder"
      - "--mm-feature-transport"
      - "cpu"
      - "--speculative-algorithm"
      - "NEXTN"
      - "--speculative-num-steps"
      - "3"
      - "--speculative-eagle-topk"
      - "1"
      - "--speculative-num-draft-tokens"
      - "4"
      - "--speculative-draft-model-quantization"
      - "modelopt_mixed"
      - "--disable-flashinfer-autotune"
      - "--enable-metrics"
      - "--max-mamba-cache-size"
      - "8"
      - "--json-model-override-args"
      - "{\"text_config\": {\"rope_parameters\": {\"mrope_interleaved\": true, \"mrope_section\": [11, 11, 10], \"rope_type\": \"yarn\", \"rope_theta\": 10000000, \"partial_rotary_factor\": 0.25, \"factor\": 4.0, \"original_max_position_embeddings\": 262144}}}"
