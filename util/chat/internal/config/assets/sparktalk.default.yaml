# SparkTalk 설정
# 이 파일은 최초 실행 시 작업 디렉터리에 sparktalk.yaml로 생성됩니다.

server:
  # 다른 PC에서도 접속하려면 0.0.0.0을 사용합니다.
  listen_addr: 0.0.0.0:8585
  database: sparktalk.db

model:
  # OpenAI 호환 API의 기본 URL입니다. /v1은 붙이지 않습니다.
  endpoint: http://192.168.100.61:8000
  # 비워두면 /v1/models의 첫 모델을 사용합니다.
  default_model: ""
  api_key: ""
  # 자유 입력: none, minimal, low, medium, high, xhigh, max 또는 0.0~0.99
  reasoning_effort: medium
  # 모든 대화에 공통 적용할 지침입니다. 비워두면 사용하지 않습니다.
  system_prompt: ""
  # 설정 화면에서 관리하는 시스템 프롬프트 프리셋입니다.
  system_prompt_preset: ""
  system_prompt_presets: []

asr:
  # 음성은 전사 텍스트로, 영상은 영상과 음성 전사를 함께 모델에 전달합니다.
  enabled: true
  ffmpeg_endpoint: http://127.0.0.1:8698
  endpoint: http://127.0.0.1:8694
  model: qwen3-asr
  # auto 또는 Qwen3-ASR이 지원하는 언어명을 입력합니다.
  language: auto
  # 노래·전문용어 등 문맥 힌트가 필요할 때만 입력합니다.
  prompt: ""
  # 연속 음성대기에서 문장부호와 짧은 추임새만 인식된 결과를 자동 전송하지 않습니다.
  filter_fillers: true
  timeout: 30m

tts:
  # AI 답변을 Qwen3-TTS CustomVoice로 읽습니다.
  enabled: true
  endpoint: http://127.0.0.1:8692
  model: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
  language: Korean
  voice: Sohee
  # 감정·말투 지시가 필요할 때만 입력합니다.
  instructions: ""
  # -1은 매번 무작위입니다.
  seed: -1
  # 답변마다 자동으로 읽을지 여부입니다. 수동 읽기는 항상 사용할 수 있습니다.
  auto_play: false
  timeout: 10m

context:
  # 전체 대화는 보존하고 모델 입력만 구간별로 요약합니다. 0은 백엔드 자동 감지입니다.
  enabled: true
  window_tokens: 0
  compact_at_percent: 80
  output_reserve: 8192
  safety_margin: 4096
  recent_tokens: 32768
  # 자동 감지가 어려운 멀티모달 입력의 보수적인 장당 추정치입니다.
  image_tokens: 2048

tools:
  # 모델이 필요할 때 내장 web_search/web_fetch를 호출합니다.
  enabled: true
  max_rounds: 3
  search_results: 5
  timeout: 15s

extra:
  # 등록한 서버에 대한 SSH 명령은 항상 화면 승인을 받은 뒤 실행합니다.
  ssh_enabled: false
  ssh_endpoint: http://127.0.0.1:8699

appearance:
  # 내장 프리셋은 preset:이 붙으며, 커스텀 업로드는 /api/images/...로 저장됩니다.
  assistant_avatar: preset:spark
  user_avatar: preset:person-blue
