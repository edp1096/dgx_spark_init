services:
  runtime:
    image: sparktalk-extra-collector:latest
    container_name: sparktalk-extra-collector
    restart: unless-stopped
    init: true
    ports: ["127.0.0.1:8695:8695"]
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      SPARKTALK_EXTRA_COLLECTOR_LISTEN_ADDR: 0.0.0.0:8695
      SPARKTALK_EXTRA_COLLECTOR_CHROMIUM_PATH: /usr/bin/chromium
      SPARKTALK_EXTRA_COLLECTOR_MAX_MB: "256"
      SPARKTALK_EXTRA_COLLECTOR_MAX_CONCURRENCY: "1"
      SPARKTALK_EXTRA_COLLECTOR_TIMEOUT_SECONDS: "120"
      SPARKTALK_EXTRA_COLLECTOR_BROWSER_WAIT_MS: "1200"
      HOME: /tmp/sparktalk-extra-collector-home
      TZ: ${TZ:-Asia/Seoul}
    read_only: true
    tmpfs:
      - /tmp:size=1024m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
