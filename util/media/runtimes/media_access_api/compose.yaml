services:
  api:
    build:
      context: .
      args:
        POT_PROVIDER_VERSION: ${POT_PROVIDER_VERSION:-1.3.1}
        POT_PROVIDER_DIGEST: ${POT_PROVIDER_DIGEST:-sha256:bea3cfda79245700d7ad90500052b4358b1c1828fdc0961929624b83933121bc}
        BROWSEFORGE_VERSION: ${BROWSEFORGE_VERSION:-v2.1.12}
        BROWSEFORGE_DIGEST: ${BROWSEFORGE_DIGEST:-sha256:3f76a2a7d90d41d5c6e05cf75f7274e62fffe326c716b723b8da79acb8731f12}
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-1.62.0}
        PLAYWRIGHT_DIGEST: ${PLAYWRIGHT_DIGEST:-sha256:aa81288e738725378becba5b3e06cb0f3a7f012a610e87e8d767a090ea3f740d}
        YTDLP_VERSION: ${YTDLP_VERSION:-2026.8.19}
        CAMOUFOX_VERSION: ${CAMOUFOX_VERSION:-0.5.5}
        PLAYWRIGHT_CAPTCHA_VERSION: ${PLAYWRIGHT_CAPTCHA_VERSION:-0.1.5}
        CAMOUFOX_BROWSER_VERSION: ${CAMOUFOX_BROWSER_VERSION:-152.0.4-beta.28}
        CAMOUFOX_BROWSER_SHA256: ${CAMOUFOX_BROWSER_SHA256:-3a105a2fc929e80a79b4b7fce2c93ed62c4fb2c877f3c1ed2a5d66a1c4fe968f}
    image: ghcr.io/edp1096/media-access-api:${MEDIA_ACCESS_IMAGE_TAG:-v1.0.2}
    container_name: media-access-api
    restart: unless-stopped
    init: true
    network_mode: host
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8697/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      MEDIA_DATA_DIR: /data
      MEDIA_MAX_UPLOAD_MB: ${MEDIA_MAX_UPLOAD_MB:-16384}
      MEDIA_BROWSER_TIMEOUT_SECONDS: ${MEDIA_BROWSER_TIMEOUT_SECONDS:-45}
      BROWSEFORGE_API_URL: http://127.0.0.1:19280
      BROWSEFORGE_TOKEN_FILE: /data/browseforge/data/.api-token
      BROWSEFORGE_RUNTIME: browseforge-chromium
      BROWSEFORGE_TIMEOUT_SECONDS: ${BROWSEFORGE_TIMEOUT_SECONDS:-45}
      BROWSEFORGE_DOCKER_GPU_MODE: software
      DIRECT_CHROMIUM_EXECUTABLE: /opt/direct-chromium/chrome
      DIRECT_CHROMIUM_DISPLAY: :98
      DIRECT_CHROMIUM_CDP_PORT: "19281"
      DIRECT_CHROMIUM_PROFILE_DIR: /data/direct-chromium/profiles
      DIRECT_CHROMIUM_X11_COMMAND: /usr/bin/xdotool
      DIRECT_CHROMIUM_CHALLENGE_TIMEOUT_SECONDS: ${DIRECT_CHROMIUM_CHALLENGE_TIMEOUT_SECONDS:-60}
      DIRECT_CAMOUFOX_EXECUTABLE: /opt/browseforge/browsers/camoufox/camoufox
      DIRECT_CAMOUFOX_PROFILE_DIR: /data/direct-camoufox/profiles
      DIRECT_CAMOUFOX_X11_COMMAND: /usr/bin/xdotool
      DIRECT_CAMOUFOX_XVFB_RUN: /usr/bin/xvfb-run
      DIRECT_CAMOUFOX_TIMEOUT_SECONDS: ${DIRECT_CAMOUFOX_TIMEOUT_SECONDS:-90}
      DIRECT_CAMOUFOX_WORKER_TIMEOUT_SECONDS: ${DIRECT_CAMOUFOX_WORKER_TIMEOUT_SECONDS:-150}
      CAMOUFOX_PROFILE_DIR: /data/camoufox/profiles
      CAMOUFOX_EXECUTABLE: /opt/browseforge/browsers/camoufox/camoufox
      CAMOUFOX_FIREFOX_VERSION: ${CAMOUFOX_FIREFOX_VERSION:-152}
      CAMOUFOX_FINGERPRINT_OS: linux
      CAMOUFOX_FINGERPRINT_TIMEZONE: Asia/Seoul
      CAMOUFOX_X11_CLICK_COMMAND: /usr/bin/xdotool
      CAMOUFOX_XVFB_RUN: /usr/bin/xvfb-run
      CAMOUFOX_TIMEOUT_SECONDS: ${CAMOUFOX_TIMEOUT_SECONDS:-60}
      CAMOUFOX_WORKER_TIMEOUT_SECONDS: ${CAMOUFOX_WORKER_TIMEOUT_SECONDS:-180}
      TZ: Asia/Seoul
    volumes:
      - type: bind
        source: ${MEDIA_ACCESS_DATA_DIR:-${HOME}/.local/share/media-access-api}
        target: /data
