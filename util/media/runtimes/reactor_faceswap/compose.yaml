services:
  api:
    init: true
    build:
      context: .
    image: dgx-reactor-faceswap:latest
    container_name: reactor-faceswap-api
    restart: unless-stopped
    network_mode: host
    ipc: host
    gpus: all
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      API_PORT: "8706"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      - hf-cache:/root/.cache/huggingface
      - reactor-models:/opt/ComfyUI/models

volumes:
  hf-cache:
    name: media-hf-cache
    external: true
  reactor-models:
    name: media-reactor-models
