services:
  llama-server:
    container_name: llama-cpp-spark
    image: llama.cpp-spark:v0.2.0
    build:
      context: .
      args:
        LLAMA_CPP_REF: ${LLAMA_CPP_REF:-v0.2.0}
    ports:
      - "${LLAMA_BIND_ADDR:-0.0.0.0}:${LLAMA_PORT:-8696}:8696"
    environment:
      MODEL_FILE: ${LLAMA_MODEL_FILE:-Huihui-gemma-4-E2B-it-qat-q4_0-unquantized-abliterated-Q4_K.gguf}
      MTP_FILE: ${LLAMA_MTP_FILE:-mtp-ggml-model-bf16.gguf}
      MTP_ENABLED: ${LLAMA_MTP_ENABLED:-true}
      MMPROJ_FILE: ${LLAMA_MMPROJ_FILE:-mmproj-model-bf16.gguf}
      MMPROJ_ENABLED: ${LLAMA_MMPROJ_ENABLED:-true}
      CONTEXT_SIZE: ${LLAMA_CONTEXT_SIZE:-65536}
    volumes:
      - "${LLAMA_MODEL_DIR:-/home/edp1096/.cache/gguf/huihui-gemma4-e2b-qat}:/models:ro"
      - "/home/edp1096/.cache/gguf/llama-cache:/root/.cache/llama.cpp"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    working_dir: /llama.cpp
    command:
      - bash
      - -c
      - |
        args=(
          -m "/models/$${MODEL_FILE}"
          --alias huihui-gemma4-e2b
          --jinja
          --reasoning off
          --no-mmap
          --ctx-size "$${CONTEXT_SIZE}"
          --parallel 1
          --host 0.0.0.0
          --port 8696
          --n-gpu-layers all
          --flash-attn on
        )
        if [[ "$${MMPROJ_ENABLED}" == "true" && -f "/models/$${MMPROJ_FILE}" ]]; then
          args+=(--mmproj "/models/$${MMPROJ_FILE}")
        else
          args+=(--no-mmproj)
        fi
        if [[ "$${MTP_ENABLED}" == "true" && -f "/models/$${MTP_FILE}" ]]; then
          args+=(
            --spec-type draft-mtp
            --spec-draft-n-max 4
            --spec-draft-model "/models/$${MTP_FILE}"
            --spec-draft-ngl all
          )
        fi
        exec ./llama-server "$${args[@]}"
