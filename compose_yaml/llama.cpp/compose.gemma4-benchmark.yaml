services:
  llama-gemma4-benchmark:
    container_name: llama-gemma4-benchmark
    image: llama.cpp-spark:v0.2.0-gemma4-benchmark
    build:
      context: .
      args:
        LLAMA_CPP_REF: v0.2.0
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      CONTEXT_SIZE: "4096"
      SERVER_PORT: "5000"
      MODEL_FILE: "${MODEL_FILE:-Huihui-gemma-4-E2B-it-qat-q4_0-unquantized-abliterated-Q4_K.gguf}"
      MTP_FILE: "${MTP_FILE:-mtp-ggml-model-bf16.gguf}"
      MTP_ENABLED: "${MTP_ENABLED:-true}"
      MMPROJ_FILE: "${MMPROJ_FILE:-mmproj-model-bf16.gguf}"
      MMPROJ_ENABLED: "${MMPROJ_ENABLED:-false}"
    volumes:
      - "${LLAMA_MODEL_DIR:-/home/edp1096/.cache/gguf/huihui-gemma4-e2b-qat}:/models:ro"
      - "/home/edp1096/.cache/gguf/llama-cache:/root/.cache/llama.cpp"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    working_dir: /llama.cpp
    command:
      - bash
      - -c
      - |
        args=(
          -m "/models/$${MODEL_FILE}"
          --alias huihui-gemma4-e2b
          --jinja
          --reasoning off
          --no-mmap
          --ctx-size "$${CONTEXT_SIZE}"
          --parallel 1
          --host 0.0.0.0
          --port "$${SERVER_PORT}"
          --n-gpu-layers all
          --flash-attn on
        )
        if [[ "$${MMPROJ_ENABLED}" == "true" && -f "/models/$${MMPROJ_FILE}" ]]; then
          args+=(--mmproj "/models/$${MMPROJ_FILE}")
        else
          args+=(--no-mmproj)
        fi
        if [[ "$${MTP_ENABLED}" == "true" && -f "/models/$${MTP_FILE}" ]]; then
          args+=(
            --spec-type draft-mtp
            --spec-draft-n-max 4
            --spec-draft-model "/models/$${MTP_FILE}"
            --spec-draft-ngl all
          )
        fi
        exec ./llama-server "$${args[@]}"
