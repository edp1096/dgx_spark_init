services:
  sglang:
    init: true
    image: "lmsysorg/sglang@sha256:febfb971c7352570fc445c466ebd6ffc9d896024958e544a60f2137fd85856b1"
    container_name: sglang-qwen38-27b
    ipc: host
    shm_size: "16gb"
    mem_limit: "100g"
    memswap_limit: "100g"
    ports:
      - "8000:30000"
    environment:
      PYTHONUNBUFFERED: "1"
      HF_XET_HIGH_PERFORMANCE: "1"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      TORCHINDUCTOR_CACHE_DIR: "/root/.cache/sglang/inductor"
    volumes:
      - "/home/edp1096/.cache/huggingface:/root/.cache/huggingface"
      - "/home/edp1096/.cache/sglang-qwen38:/root/.cache/sglang"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["python3", "-m", "sglang.launch_server"]
    command:
      - --model-path
      - RadixArk/Qwen3.8-27B-NVFP4
      - --revision
      - 52d1adc5f38aa5ebf099c29ed7025ba34cfbb854
      - --tp-size
      - "1"
      - --served-model-name
      - Qwen3.8-27B-NVFP4
      - --trust-remote-code
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      - --mem-fraction-static
      - "0.50"
      - --attention-backend
      - flashinfer
      - --chunked-prefill-size
      - "8192"
      - --disable-prefill-cuda-graph
      - --cuda-graph-max-bs
      - "4"
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder
      - --mm-feature-transport
      - cpu
      - --speculative-algorithm
      - DSPARK
      - --speculative-draft-model-path
      - RadixArk/Qwen3.8-27B-DSpark
      - --speculative-draft-model-revision
      - 923ed3a8572615643f0137e424e4ce4edd7f1cda
      - --speculative-dspark-block-size
      - "7"
      - --speculative-draft-model-quantization
      - unquant
      - --mamba-radix-cache-strategy
      - extra_buffer_lazy
      - --mamba-ssm-dtype
      - bfloat16
      - --max-mamba-cache-size
      - "96"
      - --max-running-requests
      - "8"
      - --enable-torch-compile
      - --torch-compile-max-bs
      - "4"
      - --num-continuous-decode-steps
      - "2"
      - --enable-metrics
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:30000/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 10m
    restart: unless-stopped

  open-webui:
    init: true
    image: "ghcr.io/open-webui/open-webui:main"
    container_name: open-webui-sgl-qwen38-27b
    ports:
      - "0.0.0.0:12000:8080"
    environment:
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URLS: "http://sglang:30000/v1"
      OPENAI_API_KEYS: "local-sglang"
      WEBUI_AUTH: "false"
    volumes:
      - "/home/edp1096/.cache/openwebui-sgl-qwen38:/app/backend/data"
    depends_on:
      sglang:
        condition: service_healthy
    restart: unless-stopped
