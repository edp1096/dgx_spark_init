services:
  api:
    init: true
    build:
      context: .
      target: runtime
      args:
        NEMO_SPEECH_REF: ${NEMO_SPEECH_REF:-7752dabb3453ec7c5fd751e5e2052650aaa20497}
        CUDA_ARCH: ${NEMO_CUDA_ARCH:-121}
        BUILD_JOBS: ${NEMO_BUILD_JOBS:-4}
    image: sparktalk-magpie-tts:v2607-longform1
    container_name: sparktalk-magpie-tts
    restart: unless-stopped
    ports:
      - "${MAGPIE_BIND_ADDR:-127.0.0.1}:${MAGPIE_PORT:-8692}:8692"
    gpus: all
    volumes:
      - "${MAGPIE_MODEL_DIR:-/home/edp1096/.cache/nemo-speech/magpie-v2607}:/models:ro"
    command:
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8692"
      - --no-ui
      - --threads
      - "1"
      - --tts.longform
      - "auto"
      - --tts.magpie-model
      - /models/magpie-v2607-pr17-speaker-order-v2.f16.gguf
      - --tts.codec-model
      - /models/nano-codec.decoder.f16.gguf
      - --tts.tokenizer-model-dir
      - /models/extracted
      - --tts.language-code
      - "${MAGPIE_LANGUAGE:-ko-KR}"
      - --tts.voice-name
      - "${MAGPIE_VOICE:-Sofia}"
    healthcheck:
      test: ["CMD", "/opt/nemo-speech/nemo-speech", "health", "--url", "http://127.0.0.1:8692/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  converter:
    profiles: ["tools"]
    build:
      context: .
      target: converter
      args:
        NEMO_SPEECH_REF: ${NEMO_SPEECH_REF:-7752dabb3453ec7c5fd751e5e2052650aaa20497}
    image: sparktalk-magpie-converter:v2607
    volumes:
      - "${MAGPIE_MODEL_DIR:-/home/edp1096/.cache/nemo-speech/magpie-v2607}:/models"
