services:
  vllm:
    container_name: vllm-qwen38-27b-official
    command:
      - Qwen/Qwen3.8-27B-FP8
      - --served-model-name
      - Qwen3.8-27B-FP8
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "32768"
      - --gpu-memory-utilization
      - "0.85"
      - --max-num-seqs
      - "8"
      - --max-num-batched-tokens
      - "8192"
      - --quantization
      - fp8
      - --kv-cache-dtype
      - fp8
      - --load-format
      - safetensors
      - --attention-backend
      - flashinfer
      - --enable-prefix-caching
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_xml
      - --reasoning-parser
      - qwen3
      - --default-chat-template-kwargs
      - '{"preserve_thinking": true}'
      - --speculative-config
      - '{"method":"dspark","model":"Doopeworld/Qwen3.8-27B-DSpark-vLLM","num_speculative_tokens":7,"draft_sample_method":"probabilistic"}'
      - --trust-remote-code
