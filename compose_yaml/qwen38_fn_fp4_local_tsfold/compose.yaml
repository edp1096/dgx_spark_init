services:
  runtime:
    pull_policy: never
    init: true
    restart: unless-stopped
    ipc: host
    network_mode: bridge
    gpus: all
    mem_limit: 112g
    memswap_limit: 112g
    build:
      context: ${SPARKTALK_BUILD_DIR:-.}
    security_opt:
    - seccomp=unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864
    image: local/sparktalk-qwen38-fp4-tensorfold:db281878-ko2
    container_name: sparktalk-qwen38-fp4-local
    ports:
    - ${SPARKTALK_BIND_ADDR:-0.0.0.0}:${SPARKTALK_PORT:-18004}:8000
    environment:
      PYTHONUNBUFFERED: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TENSORFOLD_NO_UPDATE_CHECK: '1'
      TENSORFOLD_MEMORY_RESERVE_GIB: '4'
      OMP_NUM_THREADS: '4'
      TENSORFOLD_CUDA_KERNELS: /opt/tensorfold/share/tensorfold/cuda/sm121
      TENSORFOLD_VISION_PYTHONPATH: /opt/tensorfold/python
      TF_FLASHNEXT_YARN: '4'
      TF_FLASHNEXT_DEPTH: '4'
      TF_FLASHNEXT_PRODUCT_STREAMS: '1'
      TF_FLASHNEXT_PREFILL_TAIL: '512'
      TF_FLASHNEXT_PROMPT_EXPERT_TILE: '2'
      TENSORFOLD_MAX_IMAGES: '50'
      TENSORFOLD_IMAGE_TOKENS: '16384'
    volumes:
    - ${SPARKTALK_HF_CACHE:-${HOME}/.cache/huggingface}/edp1096/Huihui-Qwen3.8-Flash-Next-abliterated-FP4-Local:/model:ro
    - ${SPARKTALK_DATA_DIR:-${HOME}/.local/share/sparktalk}/cache/qwen38-fp4-tensorfold:/cache
    command:
    - serve
    - /model
    - --name
    - edp1096/Huihui-Qwen3.8-Flash-Next-abliterated-FP4-Local
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    - --context
    - '1048576'
    - --parallel
    - '1'
    - --max-tokens
    - '4096'
    - --temperature
    - '0'
    - --top-p
    - '0.95'
    - --top-k
    - '20'
    - --no-thinking
    - --kv-dtype
    - fp8
    - --vision
    - --vision-max-images
    - '50'
    - --vision-max-videos
    - '4'
    - --vision-image-tokens
    - '16384'
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',
        timeout=5)
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 30m
