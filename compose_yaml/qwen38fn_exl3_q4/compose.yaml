services:
  runtime:
    image: sparktalk-qwen38fn-exl3-q4:0.7.3-yarn-schema1
    build:
      context: ${SPARKTALK_BUILD_DIR:-.}
      dockerfile: Dockerfile
      target: runtime
    pull_policy: never
    container_name: sparktalk-qwen38fn-exl3-q4
    restart: unless-stopped
    network_mode: bridge
    ipc: host
    mem_limit: "112g"
    memswap_limit: "112g"
    cpuset: "5-9,15-19"
    ports: ["${SPARKTALK_BIND_ADDR:-127.0.0.1}:${SPARKTALK_PORT:-18004}:30000"]
    environment:
      HF_HUB_OFFLINE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${SPARKTALK_HF_CACHE:-${HOME}/.cache/huggingface}:/hf:ro
      - ${SPARKTALK_DATA_DIR:-${HOME}/.local/share/sparktalk}/cache/qwen38fn_exl3_q4:/runtime
    gpus: all
