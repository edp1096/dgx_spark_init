services:
  api:
    build:
      context: .
      args:
        RUNTIME_BASE_IMAGE: ${RUNTIME_BASE_IMAGE:-ubuntu:24.04}
        YTDLP_VERSION: ${YTDLP_VERSION:-2026.07.04}
        DENO_VERSION: ${DENO_VERSION:-2.8.1}
    image: sparktalk-media-api:${SPARKTALK_MEDIA_API_IMAGE_TAG:-latest}
    container_name: sparktalk-media-api
    restart: unless-stopped
    init: true
    ports:
      - "${SPARKTALK_MEDIA_API_BIND_ADDR:-127.0.0.1}:${SPARKTALK_MEDIA_API_PORT:-8698}:8698"
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      SPARKTALK_MEDIA_API_LISTEN_ADDR: 0.0.0.0:8698
      SPARKTALK_MEDIA_API_MAX_UPLOAD_MB: ${SPARKTALK_MEDIA_API_MAX_UPLOAD_MB:-512}
      SPARKTALK_MEDIA_API_MAX_DOWNLOAD_MB: ${SPARKTALK_MEDIA_API_MAX_DOWNLOAD_MB:-4096}
      SPARKTALK_MEDIA_API_MAX_DURATION_SECONDS: ${SPARKTALK_MEDIA_API_MAX_DURATION_SECONDS:-14400}
      SPARKTALK_MEDIA_API_MAX_VIDEO_HEIGHT: ${SPARKTALK_MEDIA_API_MAX_VIDEO_HEIGHT:-720}
      SPARKTALK_MEDIA_API_MAX_CONCURRENCY: ${SPARKTALK_MEDIA_API_MAX_CONCURRENCY:-2}
      SPARKTALK_MEDIA_API_TIMEOUT_SECONDS: ${SPARKTALK_MEDIA_API_TIMEOUT_SECONDS:-1800}
      HOME: /tmp/sparktalk-media-home
      DENO_DIR: /tmp/deno
      # yt-dlp's PyInstaller libraries require an executable temporary path.
      # The large media tmpfs remains noexec; this small path uses the layer.
      TMPDIR: /var/tmp
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ytdlp-data:/var/lib/sparktalk-media-api
    tmpfs:
      - /tmp:size=${SPARKTALK_MEDIA_API_TMPFS_SIZE:-6g},mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/usr/local/bin/sparktalk-media-api", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ytdlp-data:
