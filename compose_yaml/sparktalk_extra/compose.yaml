name: sparktalk-extra

services:
  media:
    build:
      context: .
      dockerfile: Dockerfile.media
      args:
        RUNTIME_BASE_IMAGE: ${RUNTIME_BASE_IMAGE:-ubuntu:24.04}
        YTDLP_VERSION: ${YTDLP_VERSION:-2026.07.04}
        DENO_VERSION: ${DENO_VERSION:-2.8.1}
    image: sparktalk-extra-media:${SPARKTALK_EXTRA_IMAGE_TAG:-latest}
    container_name: sparktalk-extra-media
    restart: unless-stopped
    init: true
    ports:
      - "${SPARKTALK_EXTRA_MEDIA_BIND_ADDR:-127.0.0.1}:${SPARKTALK_EXTRA_MEDIA_PORT:-8690}:8698"
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      SPARKTALK_EXTRA_MEDIA_LISTEN_ADDR: 0.0.0.0:8698
      SPARKTALK_EXTRA_MEDIA_MAX_UPLOAD_MB: ${SPARKTALK_EXTRA_MEDIA_MAX_UPLOAD_MB:-512}
      SPARKTALK_EXTRA_MEDIA_MAX_DOWNLOAD_MB: ${SPARKTALK_EXTRA_MEDIA_MAX_DOWNLOAD_MB:-4096}
      SPARKTALK_EXTRA_MEDIA_MAX_DURATION_SECONDS: ${SPARKTALK_EXTRA_MEDIA_MAX_DURATION_SECONDS:-14400}
      SPARKTALK_EXTRA_MEDIA_MAX_VIDEO_HEIGHT: ${SPARKTALK_EXTRA_MEDIA_MAX_VIDEO_HEIGHT:-720}
      SPARKTALK_EXTRA_MEDIA_MAX_CONCURRENCY: ${SPARKTALK_EXTRA_MEDIA_MAX_CONCURRENCY:-2}
      SPARKTALK_EXTRA_MEDIA_TIMEOUT_SECONDS: ${SPARKTALK_EXTRA_MEDIA_TIMEOUT_SECONDS:-1800}
      HOME: /tmp/sparktalk-extra-media-home
      DENO_DIR: /tmp/deno
      TMPDIR: /var/tmp
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ytdlp-data:/var/lib/sparktalk-extra/media
    tmpfs:
      - /tmp:size=${SPARKTALK_EXTRA_MEDIA_TMPFS_SIZE:-6g},mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/usr/local/bin/sparktalk-extra-media", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  ssh:
    build:
      context: .
      dockerfile: Dockerfile.ssh
      args:
        RUNTIME_BASE_IMAGE: ${RUNTIME_BASE_IMAGE:-ubuntu:24.04}
    image: sparktalk-extra-ssh:${SPARKTALK_EXTRA_IMAGE_TAG:-latest}
    container_name: sparktalk-extra-ssh
    restart: unless-stopped
    init: true
    ports:
      - "${SPARKTALK_EXTRA_SSH_BIND_ADDR:-127.0.0.1}:${SPARKTALK_EXTRA_SSH_PORT:-8699}:8699"
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      SPARKTALK_EXTRA_SSH_LISTEN_ADDR: 0.0.0.0:8699
      SPARKTALK_EXTRA_SSH_KEY_DIR: /run/sparktalk-extra/keys
      SPARKTALK_EXTRA_SSH_KNOWN_HOSTS: /var/lib/sparktalk-extra/known_hosts
      SPARKTALK_EXTRA_SSH_MAX_CONCURRENCY: ${SPARKTALK_EXTRA_SSH_MAX_CONCURRENCY:-2}
      SPARKTALK_EXTRA_SSH_MAX_OUTPUT_MB: ${SPARKTALK_EXTRA_SSH_MAX_OUTPUT_MB:-4}
      SPARKTALK_EXTRA_SSH_TIMEOUT_SECONDS: ${SPARKTALK_EXTRA_SSH_TIMEOUT_SECONDS:-300}
      HOME: /tmp/sparktalk-extra-ssh-home
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ${SPARKTALK_EXTRA_SSH_DATA_DIR:-/home/edp1096/.local/share/sparktalk/extra/ssh}/keys:/run/sparktalk-extra/keys
      - ${SPARKTALK_EXTRA_SSH_DATA_DIR:-/home/edp1096/.local/share/sparktalk/extra/ssh}/state:/var/lib/sparktalk-extra
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/usr/local/bin/sparktalk-extra-ssh", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  ytdlp-data:
    external: true
    name: sparktalk_media_api_ytdlp-data
