name: ${GLM53_PROJECT_NAME:-glm5-3-flash}
services:
  glm53:
    image: ${GLM53_IMAGE:-dgx-sglang-glm53:sm121-dev6}
    init: true
    restart: 'no'
    network_mode: host
    ipc: host
    shm_size: 32gb
    cap_add:
    - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864
    devices:
    - /dev/infiniband:/dev/infiniband
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    environment:
      HEAD_RAIL_IP: ${HEAD_RAIL_IP:?set HEAD_RAIL_IP in .env}
      WORKER_RAIL_IP: ${WORKER_RAIL_IP:?set WORKER_RAIL_IP in .env}
      NCCL_SUBNET: ${NCCL_SUBNET:-169.254.0.0/16}
      NCCL_IB_GID_INDEX: ${NCCL_IB_GID_INDEX:-}
      MASTER_PORT: ${MASTER_PORT:-29521}
      API_PORT: ${API_PORT:-8000}
      API_BIND: ${VLLM_BIND:-127.0.0.1}
      NCCL_NET: IB
      NCCL_IB_DISABLE: '0'
      NCCL_IB_ROCE_VERSION_NUM: '2'
      NCCL_IB_ADDR_FAMILY: AF_INET
      NCCL_IB_ADDR_RANGE: ${NCCL_SUBNET:-169.254.0.0/16}
      NCCL_NVLS_ENABLE: '0'
      NCCL_CROSS_NIC: '0'
      NCCL_IB_MERGE_NICS: '0'
      NCCL_CUMEM_ENABLE: '0'
      NCCL_IGNORE_CPU_AFFINITY: '1'
      NCCL_DEBUG: ${NCCL_DEBUG:-WARN}
      NCCL_MIN_NCHANNELS: ${NCCL_NCHANNELS:-8}
      NCCL_MAX_NCHANNELS: ${NCCL_NCHANNELS:-8}
      TORCH_NCCL_ASYNC_ERROR_HANDLING: '1'
      MODEL_HOST_PATH: ${MODEL_HOST_PATH:?select NVFP4 checkpoint}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-glm-5.3-flash}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-1048576}
      MAX_NUM_SEQS: ${MAX_NUM_SEQS:-1}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HOME: /cache/huggingface
      MEM_FRACTION_STATIC: ${MEM_FRACTION_STATIC:-0.94}
      MAX_TOTAL_TOKENS: ${MAX_TOTAL_TOKENS:-${MAX_MODEL_LEN:-1048576}}
      MAX_MAMBA_CACHE_SIZE: ${MAX_MAMBA_CACHE_SIZE:-8}
      CHUNKED_PREFILL_SIZE: ${CHUNKED_PREFILL_SIZE:-4096}
      DECODE_CUDA_GRAPH: ${DECODE_CUDA_GRAPH:-1}
      SPECULATIVE_ALGORITHM: ${SPECULATIVE_ALGORITHM:-DFLASH}
      DRAFT_MODEL_HOST_PATH: ${DRAFT_MODEL_HOST_PATH:-${HOME}/.cache/huggingface/incoai/GLM-5.3-Flash-DFlash2}
      DFLASH_TOKENS: ${DFLASH_TOKENS:-5}
      DRAFT_KV_CACHE_DTYPE: ${DRAFT_KV_CACHE_DTYPE:-fp8_e4m3}
      SGLANG_DSA_MQA_LOGITS_FREE_MEM_FRACTION: ${SGLANG_DSA_MQA_LOGITS_FREE_MEM_FRACTION:-0.08}
      # Do not retain the whole mmap storage when copying a rank-local expert slice.
      SGLANG_MOE_COPY_WEIGHT_VIEWS_BEFORE_H2D: ${SGLANG_MOE_COPY_WEIGHT_VIEWS_BEFORE_H2D:-1}
      SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN: '1'
      OMP_NUM_THREADS: '1'
      # Reuse growing DSA indexer score buffers without accumulating fixed segments.
      PYTORCH_ALLOC_CONF: expandable_segments:True
      MAX_JOBS: '2'
      FLASHINFER_DISABLE_VERSION_CHECK: '0'
    volumes:
    - type: bind
      source: ${HF_CACHE:-${HOME}/.cache/huggingface}
      target: ${HF_CACHE:-${HOME}/.cache/huggingface}
      read_only: true
      bind:
        create_host_path: false
    - ${GLM53_CACHE_PATH:-${HOME}/.cache/glm53-sglang}:/root/.cache
    - ./entrypoint.sh:/opt/glm53/entrypoint.sh:ro
    - ./validate_processor.py:/opt/glm53/validate_processor.py:ro
    - ./check_models.py:/opt/glm53/check_models.py:ro
    - ./prepare_chat_template.py:/opt/glm53/prepare_chat_template.py:ro
    entrypoint:
    - /opt/glm53/entrypoint.sh
