services:
  vllm:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    image: dgx-vllm-qwen38fn:sm121
    container_name: vllm-qwen38fn
    restart: unless-stopped
    ipc: host
    shm_size: "16gb"
    ports:
      - "${VLLM_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    environment:
      HF_HOME: /hf
      HF_HUB_OFFLINE: "1"
      VLLM_PLE_MMAP: "1"
      VLLM_PLE_MMAP_WORKERS: "32"
      VLLM_PLE_MMAP_PREWARM: "0"
      VLLM_QSA_EXACT_TOPK: "1"
      VLLM_USE_FLASHINFER_SAMPLER: "1"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "0"
      VLLM_FP8_HYBRID: "${VLLM_FP8_HYBRID:-0}"
      VLLM_USE_DEEP_GEMM: "${VLLM_USE_DEEP_GEMM:-0}"
    volumes:
      - ${SPARKTALK_HF_CACHE:-/home/edp1096/.cache/huggingface}:/hf
      - ${SPARKTALK_DATA_DIR:-/home/edp1096/.local/share/sparktalk}/cache/vllm-flash-next:/root/.cache/vllm
    gpus: all
    entrypoint: ["vllm", "serve"]
    command:
      - ${VLLM_QWEN38_FLASH_MODEL_PATH:-/hf/hub/models--dealignai--Qwen3.8-Flash-Next-ABLITERATED-NVFP4/snapshots/be794b990578ef3031eccf9f28e675a289a09ee9}
      - --served-model-name
      - qwen3.8-flash-next
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --load-format
      - safetensors
      - --max-model-len
      - "65536"
      - --max-num-seqs
      - "2"
      # Two concurrent 64K requests need roughly 6.3 GiB. Keep a margin
      # for FLUX, ASR, TTS and SparkTalk on the same GB10.
      - --gpu-memory-utilization
      - "0.70"
      - --kv-cache-memory
      - "7516192768"
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --max-num-batched-tokens
      - "8192"
      - --limit-mm-per-prompt
      - '{"video":1}'
      - --media-io-kwargs
      - '{"video":{"fps":2,"max_frames":96,"backend":"opencv"}}'
      - --mm-processor-cache-gb
      - "0.5"
      - -cc.cudagraph_mode=PIECEWISE
      - -cc.splitting_ops=["vllm::unified_attention_with_output","vllm::unified_mla_attention_with_output","vllm::mamba_mixer2","vllm::mamba_mixer","vllm::short_conv","vllm::qwen3_8_flash_next_ple_short_conv","vllm::qwen3_8_flash_next_qsa_with_output","vllm::linear_attention","vllm::qwen_gdn_attention_core","vllm::qwen_gdn_attention_core_fused_norm_packed","vllm::sparse_attn_indexer","vllm::ple_mmap_lookup"]
      - --no-enable-flashinfer-autotune
      - --kv-cache-dtype
      - auto
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":2}'
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 80
      start_period: 15m
