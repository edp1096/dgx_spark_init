services:
  api:
    build: .
    image: dgx-cohere-transcribe-native:2b
    container_name: cohere-transcribe-api
    restart: unless-stopped
    network_mode: host
    ipc: host
    gpus: all
    environment:
      ASR_MODEL: ${ASR_MODEL:-CohereLabs/cohere-transcribe-03-2026}
      ASR_MAX_CONCURRENCY: ${ASR_MAX_CONCURRENCY:-1}
      ASR_MAX_NEW_TOKENS: ${ASR_MAX_NEW_TOKENS:-2048}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface

volumes:
  hf-cache:
    name: media-hf-cache
    external: true
