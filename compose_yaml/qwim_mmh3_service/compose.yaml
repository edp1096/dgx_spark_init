services:
  runtime:
    image: sparktalk-qwim-mmh3:nvfp4-pdmd4-v7-edit
    build: .
    container_name: sparktalk-qwim-mmh3
    restart: "no"
    stop_grace_period: 10s
    init: true
    mem_limit: "40g"
    memswap_limit: "40g"
    network_mode: host
    ipc: host
    gpus: all
    tmpfs:
      - /job:size=256m,mode=1777
    environment:
      STATE_DIR: /state
      HF_HOME: /hf
      HF_HUB_OFFLINE: "1"
      COMFY_KITCHEN_BACKEND: cuda
      MMH3_ATTENTION: dense
      API_PORT: "${MMH3_API_PORT:-8730}"
      API_HOST: "${MMH3_API_HOST:-127.0.0.1}"
    volumes:
      - state:/state
      - ${MMH3_MODEL_CACHE:-${HOME}/.cache/huggingface}:/hf:ro

volumes:
  state:
    name: sparktalk-qwim-mmh3-state
