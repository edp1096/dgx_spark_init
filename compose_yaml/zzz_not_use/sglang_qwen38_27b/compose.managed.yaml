services:
  runtime:
    image: ${RUNTIME_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile.dflash2
    pull_policy: never
    container_name: ${RUNTIME_CONTAINER}
    restart: unless-stopped
    init: true
    ipc: host
    shm_size: 16gb
    ports: ["${BIND_ADDRESS}:${API_PORT}:30000"]
    environment:
      PYTHONUNBUFFERED: "1"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      TORCHINDUCTOR_CACHE_DIR: /root/.cache/sglang/inductor
    volumes:
      - ${MODEL_HOST_PATH:?Run manage.sh}:/models/qwen27:ro
      - ${HF_CACHE}:/root/.cache/huggingface
      - ${RUNTIME_CACHE}:/root/.cache/sglang
    gpus: all
    entrypoint: ["python3", "-m", "sglang.launch_server"]
    command:
      - --model-path
      - /models/qwen27
      - --served-model-name
      - ${SERVED_MODEL_NAME}
      - --trust-remote-code
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      - --context-length
      - "32768"
      - --mem-fraction-static
      - "0.38"
      - --attention-backend
      - flashinfer
      - --chunked-prefill-size
      - "8192"
      - --disable-prefill-cuda-graph
      - --cuda-graph-max-bs
      - "2"
      - --disable-flashinfer-autotune
      - --kv-cache-dtype
      - fp8_e4m3
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder
      - --speculative-algorithm
      - DFLASH
      - --speculative-draft-model-path
      - ${DRAFT_REPO}
      - --speculative-draft-model-revision
      - ${DRAFT_REVISION}
      - --speculative-num-draft-tokens
      - "8"
      - --max-running-requests
      - "2"
      - --enable-torch-compile
      - --torch-compile-max-bs
      - "2"
      - --enable-metrics
