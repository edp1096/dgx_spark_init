services:
  runtime:
    image: dgx-sglang-gemma4-31b-exl3mtp:2ef0fe4-exl3mtp9-splitkv1
    build:
      context: ${SPARKTALK_BUILD_DIR:?Gemma build assets required}
      dockerfile: Dockerfile.exl3
    pull_policy: never
    container_name: sglang-gemma4-31b
    restart: unless-stopped
    init: true
    ipc: host
    shm_size: 16gb
    mem_limit: "100g"
    memswap_limit: "100g"
    cpuset: "5-9,15-19"
    ports: ["${SPARKTALK_BIND_ADDR:-127.0.0.1}:${SPARKTALK_PORT:-8000}:30000"]
    environment:
      PYTHONUNBUFFERED: "1"
      HF_HUB_OFFLINE: "1"
      SPARKTALK_GEMMA_ASSISTANT_EXL3: "1"
      GEMMA31_VERIFY_SPLITKV: "1"
      HF_XET_HIGH_PERFORMANCE: "1"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      TORCHINDUCTOR_CACHE_DIR: /root/.cache/sglang/inductor
      SGLANG_MAX_THINK_TOKENS: "262144"
    volumes:
      - ${SPARKTALK_HF_CACHE:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
      - ${SPARKTALK_DATA_DIR:-${HOME}/.local/share/sparktalk}/cache/sglang-gemma31:/root/.cache/sglang
    gpus: all
    entrypoint: ["python3", "/opt/gemma4/launch_exl3.py"]
    command:
      - --model-path
      - lyf/Huihui-gemma-4-31B-it-abliterated-v2-NVFP4
      - --revision
      - 985633e8001d0bfd9b621738234394744b992907
      - --served-model-name
      - Huihui-gemma-4-31B-it-abliterated-v2-NVFP4
      - --trust-remote-code
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      - --tp-size
      - "1"
      - --context-length
      - "262144"
      - --max-total-tokens
      - "262144"
      - --swa-full-tokens-ratio
      - "0.006"
      - --mem-fraction-static
      - "0.55"
      - --attention-backend
      - triton
      - --chunked-prefill-size
      - "512"
      - --disable-prefill-cuda-graph
      - --cuda-graph-max-bs-decode
      - "1"
      - --kv-cache-dtype
      - auto
      - --speculative-draft-kv-cache-dtype
      - auto
      - --tool-call-parser
      - gemma4
      - --reasoning-parser
      - gemma4
      - --chat-template
      - /opt/gemma4/chat_template.jinja
      - --enable-strict-thinking
      - --mm-feature-transport
      - cpu
      - --speculative-algorithm
      - NEXTN
      - --speculative-draft-model-path
      - edp1096/gemma-4-31B-it-assistant-exl3
      - --speculative-draft-model-revision
      - 359650d0d9386fbe42b820c74eefa8075017ebc6
      - --speculative-num-steps
      - "9"
      - --speculative-num-draft-tokens
      - "10"
      - --speculative-eagle-topk
      - "1"
      - --speculative-draft-model-quantization
      - unquant
      - --max-running-requests
      - "1"
      - --disable-radix-cache
      - --skip-server-warmup
      - --enable-metrics
