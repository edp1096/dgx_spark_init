services:
  tools:
    profiles:
    - tools
    image: qwen38-27b-gsq-rco-gguf-tools:e71b805
    build:
      context: ./upstream
      dockerfile: Dockerfile
      target: tools
    init: true
    user: ${LOCAL_UID:-1000}:${LOCAL_GID:-1000}
    working_dir: /workspace
    environment:
      DATA_ROOT: /data
      HF_HOME: /data/hf-cache
      QUANT_THREADS: ${QUANT_THREADS:-12}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
    - ./upstream:/workspace:ro
    - ${GGUF_DATA_DIR:?GGUF data directory required}:/data
    mem_limit: 12g
    memswap_limit: 12g
    cpus: 12
    command:
    - python3
    - pipeline.py
    - prepare
  runtime:
    image: qwen38-27b-gsq-rco-gguf:e71b805
    build:
      context: ./upstream
      dockerfile: Dockerfile
      target: runtime
