services:
  runtime:
    image: qwen38-27b-gsq-rco-gguf:e71b805
    build:
      context: ${SPARKTALK_BUILD_DIR:?Embedded build assets required}
      dockerfile: Dockerfile
      target: runtime
    container_name: qwen38-27b-gsq-rco-gguf
    init: true
    environment:
      HF_HUB_OFFLINE: '1'
    volumes:
    - ${SPARKTALK_GGUF_DATA:?Execution host GGUF data required}:/data:ro
    ports:
    - ${SPARKTALK_BIND_ADDR:-127.0.0.1}:${SPARKTALK_PORT:-8000}:8080
    mem_limit: 40g
    memswap_limit: 40g
    shm_size: 1g
    restart: unless-stopped
    command:
    - llama-server
    - --model
    - /data/models/Huihui-Qwen3.8-27B-ISTA-IQ3_S-Allocation-MTP.gguf
    - --mmproj
    - /data/models/mmproj-Huihui-Qwen3.8-27B-BF16.gguf
    - --alias
    - qwen3.8-27b-ista-iq3s-mtp
    - --host
    - 0.0.0.0
    - --port
    - '8080'
    - --ctx-size
    - '32768'
    - --parallel
    - '1'
    - --cache-ram
    - '1024'
    - --n-gpu-layers
    - '99'
    - --flash-attn
    - 'on'
    - --cache-type-k
    - q8_0
    - --cache-type-v
    - q8_0
    - --batch-size
    - '512'
    - --ubatch-size
    - '512'
    - --threads
    - '8'
    - --fit
    - 'off'
    - --jinja
    - --metrics
    - --reasoning-format
    - deepseek
    - --spec-draft-backend-sampling
    - --spec-type
    - draft-mtp
    - --spec-draft-n-max
    - '3'
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 5m
    pull_policy: never
    gpus: all
    cpuset: 5-9,15-19
