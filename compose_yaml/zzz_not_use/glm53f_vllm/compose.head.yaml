services:
  glm53:
    container_name: glm53-head
    environment:
      NODE_RANK: "0"
      VLLM_HOST_IP: ${HEAD_RAIL_IP:?set HEAD_RAIL_IP in .env}
      NCCL_SOCKET_IFNAME: ${HEAD_NCCL_IF:?set HEAD_NCCL_IF in .env}
      GLOO_SOCKET_IFNAME: ${HEAD_NCCL_IF:?set HEAD_NCCL_IF in .env}
      TP_SOCKET_IFNAME: ${HEAD_NCCL_IF:?set HEAD_NCCL_IF in .env}
      MN_IF_NAME: ${HEAD_NCCL_IF:?set HEAD_NCCL_IF in .env}
      NCCL_IB_HCA: ${HEAD_NCCL_HCA:?set HEAD_NCCL_HCA in .env}
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${API_PORT:-8000}/health', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 60
      start_period: 10m
